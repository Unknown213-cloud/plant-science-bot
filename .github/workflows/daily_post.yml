name: Scheduled Instagram Post

on:
  schedule:
    - cron: '0 13 * * 1,3,5,0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate without posting or refreshing tokens'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: science-bot-repository-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install publishing dependencies
        run: pip install -r requirements-publish.txt
      - name: Configure checkpoint author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Validate every queued post
        run: python post_next.py --validate-all
      - name: Refresh and persist access token
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python refresh_ci_token.py
      - name: Publish next post or verify hosted images
        env:
          IG_ACCESS_TOKEN: ${{ env.IG_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python post_next.py --dry-run --verify-hosted
          else
            python post_next.py --skip-token-refresh
          fi
      - name: Persist archive and publication journal even after failure
        if: always() && (github.event_name == 'schedule' || !inputs.dry_run)
        run: |
          git add queue/ posted/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive published post and journal [skip ci]'
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
      - name: Retain recovery state if persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publication-recovery-${{ github.run_id }}
          path: |
            posted/publication_state.json
            posted/captions.json
          if-no-files-found: ignore
