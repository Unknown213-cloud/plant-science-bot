name: Daily Instagram Post

on:
  schedule:
    # Runs daily at 13:00 UTC (9:00 AM EST / 6:00 AM PST)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without posting or moving files'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh Instagram Access Token
        id: refresh_token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os, requests, sys

          token = os.getenv("IG_ACCESS_TOKEN", "").strip()
          if not token:
              print("No IG_ACCESS_TOKEN found in secrets. Skipping refresh.")
              sys.exit(0)

          url = "https://graph.instagram.com/refresh_access_token"
          params = {"grant_type": "ig_refresh_token", "access_token": token}
          
          try:
              resp = requests.get(url, params=params, timeout=30)
              data = resp.json()
              if resp.status_code == 200 and "access_token" in data:
                  new_token = data["access_token"]
                  expires_in = data.get("expires_in", 0)
                  days = expires_in // 86400
                  print(f"Token successfully refreshed! Valid for ~{days} days.")
                  # Export to GITHUB_ENV so subsequent steps use the fresh token
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"IG_ACCESS_TOKEN={new_token}\n")
                      f.write(f"TOKEN_REFRESHED=true\n")
                  # Set step output
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"new_token={new_token}\n")
              else:
                  err_msg = str(data)
                  if "24 hours" in err_msg.lower() or "cannot be refreshed" in err_msg.lower():
                      print("Token is active and was refreshed within the last 24 hours. Continuing with current token.")
                  else:
                      print(f"Token refresh response: {data}")
          except Exception as e:
              print(f"Token refresh attempt returned: {e}")
          EOF

      - name: Update Secret With Refreshed Token (If GH_PAT provided)
        if: env.TOKEN_REFRESHED == 'true' && env.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.refresh_token.outputs.new_token }}
        run: |
          if [ -n "$NEW_TOKEN" ]; then
            gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "${{ github.repository }}" || echo "Notice: Secret update skipped (requires repository secret write permissions)."
          fi

      - name: Publish Next Post or Dry Run
        env:
          IG_ACCESS_TOKEN: ${{ env.IG_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python post_next.py $FLAGS

      - name: Commit and Push Moved Files
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain queue/ posted/)" ]; then
            git add queue/ posted/
            git commit -m "Automated: Archive published post to posted/ [skip ci]"
            git push
          else
            echo "No queue or posted changes to commit."
          fi
